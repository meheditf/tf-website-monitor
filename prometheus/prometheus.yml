global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://hrms.techforing.com
        - https://cms.techforing.com
        - https://careeradmin.techforing.com/admin
        - http://customer.techforing.com
        - https://techforing.com
        - https://devcmsadmin.techforing.com/admin
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: (http|https)://([^/]+)
        target_label: domain
        replacement: $2
      - source_labels: [__param_target]
        regex: (http|https)://
        target_label: protocol
        replacement: $1